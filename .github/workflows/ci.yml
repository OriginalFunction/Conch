name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: 1.95.0

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: Run workspace tests
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --locked
      - name: Run Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings

  release-helpers:
    name: Release helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test deterministic packaging and release assembly
        run: python3 .github/scripts/test_release_scripts.py

  packaging:
    name: Packaging (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck dpkg-dev
      - name: Install macOS packaging tools
        if: runner.os == 'macOS'
        run: brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
      - name: Build release binaries
        run: cargo +"$RUST_TOOLCHAIN" build --workspace --release --locked --bins
      - name: Run packaging smoke tests
        env:
          BIN_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/check-packaging.sh
      - name: Inspect Debian payload
        if: runner.os == 'Linux'
        run: |
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          dpkg-deb --extract "$deb" "$stage"
          "$stage/usr/bin/conch" --version
          "$stage/usr/bin/conchd" --version
      - name: Install the generated Homebrew formula
        if: runner.os == 'macOS'
        run: |
          export CONCH_RELEASE_BASE_URL="file://${GITHUB_WORKSPACE}/dist"
          bash scripts/release-artifacts.sh --local --bin-dir target/release --outdir dist
          trap 'brew uninstall conch >/dev/null 2>&1 || true' EXIT
          bash scripts/install-homebrew.sh --formula "$GITHUB_WORKSPACE/dist/conch.rb"
          conch --version
          conchd --version
