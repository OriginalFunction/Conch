[workspace]
resolver = "2"
members = ["crates/conch-core", "crates/conchd", "crates/conch", "crates/conch-mcp"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.1.0"

[workspace.dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
ryu-js = "1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
tempfile = "3.23.0"
rand = "0.8.5"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util", "io-std"] }
form_urlencoded = "1.2.2"
axum = { version = "0.8.7", features = ["ws"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.2.0"
rustls-native-certs = "0.8.2"
subtle = "2.6.1"
url = "2.5.7"
