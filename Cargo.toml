[workspace]
resolver = "2"
members = ["crates/conch-core", "crates/conchd", "crates/conch"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4.3"
ryu-js = "1.0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
tempfile = "3.23.0"
rand = "0.8.5"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util"] }
form_urlencoded = "1.2.2"
